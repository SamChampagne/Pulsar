# Static-file server config for the Pulsar web SPA (SvelteKit adapter-static,
# ssr=false). Every unmatched path falls back to index.html so client-side
# routing (SvelteKit's router) resolves deep links (e.g. /loads/123) instead of
# nginx 404ing on them.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: try the exact file, then the exact directory, then index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache the hashed build assets (SvelteKit fingerprints filenames under
    # _app/); index.html itself must stay revalidated so deploys are picked up.
    location /_app/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
