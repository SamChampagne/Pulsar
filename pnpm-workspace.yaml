packages:
  - "apps/*"
  - "packages/*"

# pnpm 10 moved this setting here from package.json's "pnpm" field.
# Only these packages may run install scripts (prisma engines, esbuild binary).
onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - esbuild
  - prisma

# Builds we deliberately skip. Acknowledging them here keeps a clean-environment
# `pnpm install` from hard-failing with ERR_PNPM_IGNORED_BUILDS (pnpm 11) — the
# Docker images build in a fresh store where nothing is pre-approved. @scarf is
# telemetry only; its install script is safe to skip.
ignoredBuiltDependencies:
  - "@scarf/scarf"
