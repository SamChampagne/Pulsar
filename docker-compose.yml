services:
  db:
    image: postgres:16-alpine
    container_name: pulsar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulsar
      POSTGRES_PASSWORD: pulsar
      POSTGRES_DB: pulsar
    ports:
      - "5432:5432"
    volumes:
      - pulsar-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsar -d pulsar"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional self-hosted routing engine (phase 10). Opt-in profile:
  #   docker compose --profile osrm up -d osrm
  # Requires a prepared extract in ./osrm-data — see docs/getting-started.md.
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v6.0.0
    container_name: pulsar-osrm
    profiles: ["osrm"]
    restart: unless-stopped
    command: osrm-routed --algorithm mld /data/region.osrm
    ports:
      - "5000:5000"
    volumes:
      - ./osrm-data:/data

volumes:
  pulsar-pgdata:
