services:
  db:
    image: postgres:16-alpine
    container_name: pulsar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulsar
      POSTGRES_PASSWORD: pulsar
      POSTGRES_DB: pulsar
    ports:
      - "5432:5432"
    volumes:
      - pulsar-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsar -d pulsar"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pulsar-pgdata:
